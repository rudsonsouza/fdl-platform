spring:
  application:
    name: fdl-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlite:${FDL_DB_PATH:./data/fdl.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # O SQLite aceita um escritor por vez: uma única conexão evita SQLITE_BUSY dentro da aplicação.
      maximum-pool-size: 1
      data-source-properties:
        journal_mode: WAL
        foreign_keys: true
        busy_timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
  jackson:
    deserialization:
      # Também definido em JacksonConfig; mantido aqui para ficar visível na configuração.
      fail-on-unknown-properties: true

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${FDL_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${FDL_SWAGGER_ENABLED:true}

fdl:
  jwt:
    # Obrigatória fora do perfil test (validação de startup na tarefa 6.2).
    secret: ${FDL_JWT_SECRET:}
    ttl: ${FDL_JWT_TTL:PT60M}
  cors:
    allowed-origins: ${FDL_CORS_ORIGINS:http://localhost:5173}
