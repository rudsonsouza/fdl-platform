name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testes unitários, integração (SQLite temporário) e cobertura mínima de 80% (JaCoCo).
      - name: Build and verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest com a meta de cobertura de 70% (falha abaixo disso).
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Segredo descartável, só para este job.
      FDL_JWT_SECRET: ci-only-secret-ci-only-secret-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          # Registro pelo nginx prova que o proxy /api/ chega ao back-end.
          curl -fsS -X POST http://localhost:5173/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@exemplo.com","password":"senha1234"}'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
